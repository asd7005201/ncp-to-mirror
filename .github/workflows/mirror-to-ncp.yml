name: Mirror to NCP SourceCommit (SSH)

on:
  push:
    branches:
      - main

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_BRANCH: main
  DST_BRANCH: master

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH (RSA)
        env:
          NCP_SSH_KEY: ${{ secrets.NCP_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s" "$NCP_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan devtools.ncloud.com >> ~/.ssh/known_hosts

      # (선택) 서버가 ssh-rsa만 받을 때 디버그용
      - name: SSH verbose test
        run: |
          set -e
          ssh -vvv \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostkeyAlgorithms=+ssh-rsa \
            git@devtools.ncloud.com -T || true

      - name: Push main to master
        env:
          SSH_URL: ${{ secrets.NCP_GIT_URL }}  # 예: git@devtools.ncloud.com:2744031/minjun-repo.git
          GIT_SSH_COMMAND: >
            ssh -i ~/.ssh/id_rsa
                -o StrictHostKeyChecking=yes
                -o IdentitiesOnly=yes
                -o PubkeyAcceptedAlgorithms=+ssh-rsa
                -o HostkeyAlgorithms=+ssh-rsa
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote add ncp "$SSH_URL" || git remote set-url ncp "$SSH_URL"
          git push ncp "$SRC_BRANCH:$DST_BRANCH" --force-with-lease
