name: Mirror to NCP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  SRC_BRANCH: main
  DST_BRANCH: master

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) 러너에 개인키 설치 + 호스트 키 등록
      - name: Setup SSH (RSA)
        env:
          NCP_SSH_KEY: ${{ secrets.NCP_SSH_KEY }} # ====== 개인키(PEM) 원문을 저장한 시크릿 ======
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s" "$NCP_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan devtools.ncloud.com >> ~/.ssh/known_hosts

      # (선택) 키 확인용 디버그
      - name: Show public key & fingerprint (debug)
        run: |
          set -e
          echo "===== PUBLIC KEY ====="
          ssh-keygen -y -f ~/.ssh/id_rsa
          echo "===== FINGERPRINT ====="
          ssh-keygen -y -f ~/.ssh/id_rsa | ssh-keygen -E sha256 -lf -

      # 2) SSH 사용자(=콘솔의 “SSH 키” 값)로 핸드셰이크 테스트
      - name: SSH verbose test (debug, no fail)
        env:
          NCP_SSH_USER: ${{ secrets.NCP_SSH_USER }}  # ====== 예: 2744031_minjun.park_4bea0 ======
        run: |
          set -e
          ssh -vvv -T -l "$NCP_SSH_USER" devtools.ncloud.com || true

      # 3) 원격에 푸시
      - name: Push ${{ env.SRC_BRANCH }} to ${{ env.DST_BRANCH }}
        env:
          # ====== 이 URL은 git@... 금지! 두 가지 중 하나로 설정하세요. ======
          # A) ssh 스타일:  ssh://devtools.ncloud.com/2744031/minjun-repo.git
          # B) scp 스타일:  devtools.ncloud.com:2744031/minjun-repo.git
          SSH_URL: ${{ secrets.NCP_GIT_URL }}
          NCP_SSH_USER: ${{ secrets.NCP_SSH_USER }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_rsa -l "$NCP_SSH_USER" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote add ncp "$SSH_URL" || git remote set-url ncp "$SSH_URL"
          git push ncp "$SRC_BRANCH:$DST_BRANCH" --force-with-lease
