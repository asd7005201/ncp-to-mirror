name: Mirror to NCP SourceCommit (SSH)

on:
  push:
    branches:
      - main           # PR 머지 후 main에 push될 때 동작
  workflow_dispatch:    # 수동 실행도 가능

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SRC_BRANCH: main      # GitHub 원본 브랜치
  DST_BRANCH: master    # NCP 대상 브랜치

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH (RSA)
        env:
          NCP_SSH_KEY: ${{ secrets.NCP_SSH_KEY }}   # RSA 개인키(-----BEGIN/END RSA PRIVATE KEY-----)
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s" "$NCP_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan devtools.ncloud.com >> ~/.ssh/known_hosts

      # 디버그: 러너가 실제로 들고 있는 공개키/지문. (공개키는 노출 OK, 개인키는 절대 노출 금지)
      - name: Show public key & fingerprint (debug)
        run: |
          set -e
          echo "===== PUBLIC KEY (paste this into NCP if needed) ====="
          ssh-keygen -y -f ~/.ssh/id_rsa
          echo "===== FINGERPRINT ====="
          ssh-keygen -y -f ~/.ssh/id_rsa | ssh-keygen -E sha256 -lf -
        continue-on-error: true

      # 디버그: 서버가 키/알고리즘을 어떻게 받는지 확인
      - name: SSH verbose test (debug, no fail)
        run: |
          set -e
          ssh -vvv \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o HostkeyAlgorithms=+ssh-rsa \
            git@devtools.ncloud.com -T || true
        continue-on-error: true

      # 디버그: 읽기 권한 확인 (성공하면 remote refs 출력)
      - name: Git ls-remote (debug, no fail)
        env:
          SSH_URL: ${{ secrets.NCP_GIT_URL }}       # 예) git@devtools.ncloud.com:2744031/minjun-repo.git
        run: |
          set -e
          git ls-remote "$SSH_URL" || true
        continue-on-error: true

      - name: Push ${{ env.SRC_BRANCH }} to ${{ env.DST_BRANCH }}
        env:
          SSH_URL: ${{ secrets.NCP_GIT_URL }}       # 반드시 SSH 주소( git@devtools.ncloud.com:... 또는 ssh://git@devtools.ncloud.com/... )
          # 한 줄 문자열이어야 함 (줄바꿈 절대 금지)
          GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostkeyAlgorithms=+ssh-rsa'
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote add ncp "$SSH_URL" || git remote set-url ncp "$SSH_URL"
          git push ncp "$SRC_BRANCH:$DST_BRANCH" --force-with-lease
